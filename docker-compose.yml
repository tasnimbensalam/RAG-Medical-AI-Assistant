name: rag-medical

services:
  server:
    build:
      context: ./server
    image: rag-medical-server
    container_name: rag-server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploaded_docs:/app/uploaded_docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  client:
    build:
      context: ./client
    image: rag-medical-client
    container_name: rag-client
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://server:8000
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
